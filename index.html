<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>루쿠 굿즈 룰렛</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div class="eyebrow">RUCUE GOODS ROULETTE</div><h1>🎁 루쿠 굿즈 룰렛</h1><p>키링을 태그하고 오늘의 루쿠 굿즈를 뽑아봐!</p></header><section class="panel"><div id="status" role="status" aria-live="polite">비밀 룰렛을 준비하고 있어...</div><div class="wheel-wrap"><div class="pointer">▼</div><div id="wheel" class="wheel"><div class="wheel-center"><img src="rucue.png" alt="루쿠 캐릭터"></div></div></div><div id="result" class="result" aria-live="polite"></div><div id="notice" class="countdown">페이지를 열면 자동으로 한 번 회전해!</div></section><section class="panel"><h2>🎒 내 당첨 기록</h2><p class="small">이 브라우저에 저장되는 추첨 기록이야. 실제 굿즈 수령은 운영자 확인이 필요해.</p><div id="inventory" class="inventory"></div><p id="total" class="small"></p></section><section class="panel"><h2>🎁 룰렛 보상 확률</h2><div class="rewards"><span>⌨️ 키캡(기본) 33%</span><span>🐾 키캡(찌부) 33%</span><span>🎃 키캡(할로윈) 33%</span><span>🎒 파우치 1%</span></div></section><footer>서버 없이 작동하는 굿즈 추첨 · 방문할 때마다 1회 자동 회전<br>기기·브라우저가 바뀌거나 저장 데이터를 삭제하면 기록이 사라질 수 있어.</footer></main><script src="./app.js" defer></script></body></html>
