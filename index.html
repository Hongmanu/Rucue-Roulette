<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b49"><title>루쿠의 비밀 룰렛</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div class="eyebrow">RUCUE'S SECRET FOREST</div><h1>🍃 루쿠의 행운 룰렛</h1><p>파란여우의 선물 타임</p></header><section class="panel"><div id="status" role="status" aria-live="polite">비밀 룰렛을 준비하고 있어...</div><div class="wheel-wrap"><div class="pointer">▼</div><div id="wheel" class="wheel"><div class="wheel-center">RUCUE</div></div></div><div id="result" class="result" aria-live="polite"></div><div id="notice" class="countdown">페이지를 열면 자동으로 한 번 회전해!</div></section><section class="panel"><h2>🎒 내 수집 도감</h2><p class="small">이 브라우저에 저장돼. 같은 브라우저로 다시 접속하면 이어서 모을 수 있어.</p><div id="inventory" class="inventory"></div><p id="total" class="small"></p></section><section class="panel"><h2>🎁 룰렛 보상 확률</h2><div class="rewards"><span>🃏 키캡(기본) 28%</span><span>🍃 키캡(찌부) 28%</span><span>✨ 키캡(할로윈) 28%</span><span>🔑 파우 13%</span><span>🗝️ 티셔츠 3%</span></div></section><footer>서버 없이 작동하는 무료 수집 게임 · 방문할 때마다 1회 자동 회전<br>기기·브라우저가 바뀌거나 저장 데이터를 삭제하면 기록이 사라질 수 있어.</footer></main><script src="./app.js" defer></script></body></html>
